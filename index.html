<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Comodatos</title>
  
  <!-- CSS Bootstrap 5 e DataTables -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 10px; border: none; }
    .table th { background-color: #0d6efd; color: white; white-space: nowrap; vertical-align: middle; }
    .table td { white-space: nowrap; vertical-align: middle; }
    .filter-box { background-color: #ffffff; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="text-primary fw-bold m-0">Consulta de Comodatos</h3>
      <span class="badge bg-secondary fs-6" id="total-registros">Base carregando...</span>
    </div>

    <!-- PAINEL DE FILTROS -->
    <div class="filter-box shadow-sm">
      <form id="form-busca" onsubmit="return false;">
        <div class="row g-3 align-items-end">
          
          <!-- Filtro Código do Vendedor -->
          <div class="col-md-4">
            <label for="filtro-vendedor" class="form-label fw-semibold">Código do Vendedor (Vend)</label>
            <input type="text" id="filtro-vendedor" class="form-control form-control-lg" placeholder="Ex: 900 (Deixe vazio p/ todos)" autocomplete="off">
          </div>

          <!-- Busca por Código do Cliente -->
          <div class="col-md-5">
            <label for="busca-cliente" class="form-label fw-semibold">Código do Cliente (Cód)</label>
            <input type="text" id="busca-cliente" class="form-control form-control-lg" placeholder="Ex: 0200-0002 (Aperte Enter)" autocomplete="off">
          </div>

          <!-- Botões -->
          <div class="col-md-3 d-flex gap-2">
            <button type="button" id="btn-buscar" class="btn btn-primary btn-lg w-100 fw-semibold">
              <i class="bi bi-search"></i> Buscar
            </button>
            <button type="button" id="btn-limpar" class="btn btn-outline-secondary btn-lg fw-semibold">
              Limpar
            </button>
          </div>

        </div>
      </form>
    </div>

    <!-- TABELA DE RESULTADOS -->
    <div class="card shadow-sm p-3">
      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Carregando dados...</span>
        </div>
        <p class="mt-3 text-muted">Carregando base de dados de comodatos...</p>
      </div>

      <div class="table-responsive d-none" id="table-container">
        <table id="tabela-comodatos" class="table table-striped table-hover style="width:100%">
          <thead>
            <tr id="table-header"></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- JS (jQuery, PapaParse, DataTables) -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

  <script>
    let baseComodatos = [];
    let dataTableInstance = null;
    let colunas = [];

    $(document).ready(function() {
      // Carrega o CSV e trata a codificação
      Papa.parse("Clientes Comodatos.csv", {
        download: true,
        header: true,
        skipEmptyLines: true,
        encoding: "ISO-8859-1", // Ajustado para não quebrar acentos do Excel (Razão, Cód, Descrição)
        complete: function(results) {
          baseComodatos = results.data;

          if (!baseComodatos || baseComodatos.length === 0) {
            $('#loading').html('<div class="alert alert-warning">Nenhum registro encontrado no arquivo CSV.</div>');
            return;
          }

          // Identifica as colunas dinamicamente
          colunas = Object.keys(baseComodatos[0]);
          const headerRow = $('#table-header');
          headerRow.empty();
          
          colunas.forEach(col => {
            headerRow.append(`<th>${col}</th>`);
          });

          // Esconde loading e exibe a tabela vazia ou pronta
          $('#loading').addClass('d-none');
          $('#table-container').removeClass('d-none');
          $('#total-registros').text(`${baseComodatos.length.toLocaleString('pt-BR')} comodatos na base`);

          // Inicializa DataTables zerado
          inicializarTabela([]);
        },
        error: function(err) {
          $('#loading').html('<div class="alert alert-danger">Erro ao carregar o arquivo CSV. Verifique o nome do arquivo no repositório.</div>');
        }
      });

      // Função para filtrar e atualizar tabela
      function executarBusca() {
        const codVendedor = $('#filtro-vendedor').val().trim().toLowerCase();
        const codCliente = $('#busca-cliente').val().trim().toLowerCase();

        if (!codVendedor && !codCliente) {
          renderizarTabela(baseComodatos);
          return;
        }

        const resultados = baseComodatos.filter(item => {
          // Busca pelas colunas correspondentes (flexível para pequenas variações de nome)
          const vendVal = (item['Vend'] || item['VENDEDOR'] || item['Vendedor'] || '').toString().trim().toLowerCase();
          const codVal = (item['Cód'] || item['CODIGO'] || item['Cód.'] || item['Cod'] || '').toString().trim().toLowerCase();

          const atendeVend = !codVendedor || vendVal === codVendedor || vendVal.includes(codVendedor);
          const atendeCliente = !codCliente || codVal === codCliente || codVal.includes(codCliente);

          return atendeVend && atendeCliente;
        });

        renderizarTabela(resultados);
      }

      // Renderiza os dados no DataTables
      function inicializarTabela(dados) {
        dataTableInstance = $('#tabela-comodatos').DataTable({
          data: dados,
          columns: colunas.map(col => ({ data: col, defaultContent: "" })),
          language: {
            url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json'
          },
          pageLength: 20,
          destroy: true,
          responsive: true
        });
      }

      function renderizarTabela(dados) {
        if (dataTableInstance) {
          dataTableInstance.clear();
          dataTableInstance.rows.add(dados);
          dataTableInstance.draw();
        } else {
          inicializarTabela(dados);
        }
      }

      // Evento ao apertar ENTER no campo de busca ou cliente
      $('#busca-cliente, #filtro-vendedor').on('keypress', function(e) {
        if (e.which === 13) { // Tecla Enter
          e.preventDefault();
          executarBusca();
        }
      });

      // Evento ao clicar no botão Buscar
      $('#btn-buscar').on('click', function() {
        executarBusca();
      });

      // Botão Limpar
      $('#btn-limpar').on('click', function() {
        $('#filtro-vendedor').val('');
        $('#busca-cliente').val('');
        renderizarTabela(baseComodatos);
      });
    });
  </script>
</body>
</html>
